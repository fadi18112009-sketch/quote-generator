<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عرض سعر</title>
<style>
body{font-family:system-ui,sans-serif;background:#f3f4f6;margin:0;padding:16px;color:#111}
.card{background:#fff;max-width:720px;margin:0 auto;padding:20px;border-radius:12px;box-shadow:0 2px 8px #0001}
h1{font-size:22px;margin:0 0 4px}
.date{color:#666;margin:0 0 16px}
input{padding:8px;border:1px solid #ccc;border-radius:6px;font-size:16px;width:100%;box-sizing:border-box}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:12px;min-width:0}
th,td{padding:4px;font-size:14px;text-align:right;border-bottom:1px solid #e5e7eb}
td input{padding:6px;font-size:14px}td input.hours,td input.rate{width:56px}
button{padding:10px 14px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:15px}
button.del{background:none;color:#000;padding:4px}
textarea{padding:8px;border:1px solid #ccc;border-radius:6px;font-size:16px;width:100%;box-sizing:border-box;font-family:inherit}
.total{font-size:22px;margin-top:16px;font-weight:bold}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
@media print{
  body{background:#fff;padding:0}
  .card{box-shadow:none;max-width:none;padding:0}
  .noprint{display:none}
  input,textarea{border:none;padding:0}input::placeholder,textarea::placeholder{color:transparent}
}
</style>
</head>
<body>
<div class="card">
<h1>عرض سعر</h1>
<p class="date" id="date"></p>
<p><label>رقم العرض: <input id="num" placeholder="001" style="width:110px"></label></p>
<label>اسم العميل:<br><input id="client" placeholder="اكتب اسم العميل"></label>

<label>العملة: <input id="currency" value="$" style="width:90px"></label>
<div class="wrap">
<table>
<thead>
<tr><th>الخدمة</th><th>الساعات</th><th>سعر الساعة</th><th>المجموع</th><th class="noprint"></th></tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>

<div class="total">الإجمالي: <span id="total">0</span></div>

<label>ملاحظات / شروط الدفع:<br><textarea id="notes" rows="3" placeholder="مثال: الدفع 50% مقدماً والباقي عند التسليم"></textarea></label>
<div class="actions noprint">
<button id="add">+ إضافة خدمة</button>
<button id="reset" style="background:#dc2626">🗑 عرض جديد</button>
<button id="print">🖨 طباعة / حفظ PDF</button>
</div>
</div>

<script>
const KEY = 'quote-v1';
const rows = document.getElementById('rows');
const totalEl = document.getElementById('total');
const client = document.getElementById('client');
const currency = document.getElementById('currency');
const num = document.getElementById('num');
const notes = document.getElementById('notes');
document.getElementById('date').textContent = new Date().toLocaleDateString('en-GB');

function addRow(d) {
  d = d || {};
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input class="name" placeholder="الخدمة"></td>
    <td><input class="hours" type="number" min="0"></td>
    <td><input class="rate" type="number" min="0"></td>
    <td class="line">0</td>
    <td class="noprint"><button class="del">🗑</button></td>`;
  tr.querySelector('.name').value = d.name || '';
  tr.querySelector('.hours').value = (d.hours !== undefined) ? d.hours : 1;
  tr.querySelector('.rate').value = (d.rate !== undefined) ? d.rate : 0;
  rows.appendChild(tr);
}

function save() {
  try {
    const data = {
      client: client.value,
      num: num.value,
      notes: notes.value,
      currency: currency.value,
      rows: [...rows.querySelectorAll('tr')].map(tr => ({
        name: tr.querySelector('.name').value,
        hours: tr.querySelector('.hours').value,
        rate: tr.querySelector('.rate').value
      }))
    };
    localStorage.setItem(KEY, JSON.stringify(data));
  } catch (e) {}
}

function update() {
  let total = 0;
  rows.querySelectorAll('tr').forEach(tr => {
    const h = parseFloat(tr.querySelector('.hours').value) || 0;
    const r = parseFloat(tr.querySelector('.rate').value) || 0;
    const line = h * r;
    tr.querySelector('.line').textContent = line;
    total += line;
  });
  totalEl.textContent = total + ' ' + currency.value;
  save();
}

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (d) {
      client.value = d.client || '';
      num.value = d.num || '';
      notes.value = d.notes || '';
      currency.value = d.currency || '$';
      (d.rows || []).forEach(r => addRow(r));
    }
  } catch (e) {}
  if (!rows.children.length) addRow();
  update();
}

rows.addEventListener('input', update);
client.addEventListener('input', update);
currency.addEventListener('input', update);
num.addEventListener('input', update);
notes.addEventListener('input', update);
rows.addEventListener('click', e => {
  if (e.target.classList.contains('del')) {
    e.target.closest('tr').remove();
    update();
  }
});
document.getElementById('add').addEventListener('click', () => { addRow(); update(); });
document.getElementById('print').addEventListener('click', () => window.print());
document.getElementById('reset').addEventListener('click', () => {
  if (confirm('مسح العرض الحالي والبدء من جديد؟')) {
    try { localStorage.removeItem(KEY); } catch (e) {}
    location.reload();
  }
});
load();
</script>
</body>
</html>
