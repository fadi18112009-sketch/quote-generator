<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عرض سعر</title>
<style>
body{font-family:system-ui,sans-serif;background:#f3f4f6;margin:0;padding:16px;color:#111}
.card{background:#fff;max-width:720px;margin:0 auto;padding:20px;border-radius:12px;box-shadow:0 2px 8px #0001}
h1{font-size:22px;margin:0 0 4px}
.date{color:#666;margin:0 0 16px}
input{padding:8px;border:1px solid #ccc;border-radius:6px;font-size:16px;width:100%;box-sizing:border-box}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:12px;min-width:0}
th,td{padding:4px;font-size:14px;text-align:right;border-bottom:1px solid #e5e7eb}
td input{padding:6px;font-size:14px}td input.hours,td input.rate{width:56px}
button{padding:10px 14px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:15px}
button.del{background:none;color:#000;padding:4px}
textarea{padding:8px;border:1px solid #ccc;border-radius:6px;font-size:16px;width:100%;box-sizing:border-box;font-family:inherit}
.sums div{margin-top:6px}
.opts{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:12px;margin-bottom:14px;border-bottom:2px solid #2563eb}
.brand>div{flex:1}
.bname{font-size:20px;font-weight:bold}
.btitle{color:#555;font-size:14px}
.contact{margin-top:4px;font-size:14px;padding:4px 6px}
body.view #add,body.view #reset,body.view #share,body.view .del,body.view .opts{display:none}
body.view input,body.view textarea{border:none;background:transparent;padding:0;pointer-events:none}
body.view ::placeholder{color:transparent}
.total{font-size:22px;margin-top:16px;font-weight:bold}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
@media print{
  body{background:#fff;padding:0}
  .card{box-shadow:none;max-width:none;padding:0}
  .noprint{display:none}
  input,textarea{border:none;padding:0}input::placeholder,textarea::placeholder{color:transparent}
}
</style>
</head>
<body>
<div class="card">
<div class="brand">
<svg width="56" height="56" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" aria-label="شعار">
<rect width="56" height="56" rx="14" fill="#2563eb"/>
<path d="M28 8 L46 15 V28 C46 38 38 46 28 50 C18 46 10 38 10 28 V15 Z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
<text x="28" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">ف</text>
</svg>
<div>
<div class="bname">فادي ابراهيم</div>
<div class="btitle">مبرمج ومهندس أمن سيبراني</div>
<input id="contact" class="contact" placeholder="رقم الهاتف / الإيميل / رابط حسابك">
</div>
</div>
<h1>عرض سعر</h1>
<p class="date" id="date"></p>
<p><label>رقم العرض: <input id="num" placeholder="001" style="width:110px"></label></p>
<label>اسم العميل:<br><input id="client" placeholder="اكتب اسم العميل"></label>

<label>العملة: <input id="currency" value="$" style="width:90px"></label>
<div class="wrap">
<table>
<thead>
<tr><th>الخدمة</th><th>الساعات</th><th>سعر الساعة</th><th>المجموع</th><th class="noprint"></th></tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>

<div class="opts noprint">
<label>الخصم %: <input id="discount" type="number" min="0" max="100" value="0" style="width:80px"></label>
<label>الضريبة %: <input id="tax" type="number" min="0" value="0" style="width:80px"></label>
</div>
<div class="sums">
<div>المجموع الفرعي: <span id="subtotal">0</span></div>
<div id="discRow" style="display:none">الخصم (<span id="discPct">0</span>%): <span id="discAmt">0</span></div>
<div id="taxRow" style="display:none">الضريبة (<span id="taxPct">0</span>%): <span id="taxAmt">0</span></div>
</div>
<div class="total">الإجمالي: <span id="total">0</span></div>

<label>ملاحظات / شروط الدفع:<br><textarea id="notes" rows="3" placeholder="مثال: الدفع 50% مقدماً والباقي عند التسليم"></textarea></label>
<div class="actions noprint">
<button id="add">+ إضافة خدمة</button>
<button id="reset" style="background:#dc2626">🗑 عرض جديد</button>
<button id="share" style="background:#059669">🔗 نسخ رابط للعميل</button>
<button id="print">🖨 طباعة / حفظ PDF</button>
</div>
</div>

<script>
const KEY = 'quote-v1';
const rows = document.getElementById('rows');
const totalEl = document.getElementById('total');
const client = document.getElementById('client');
const currency = document.getElementById('currency');
const num = document.getElementById('num');
const notes = document.getElementById('notes');
const discount = document.getElementById('discount');
const tax = document.getElementById('tax');
const contact = document.getElementById('contact');
document.getElementById('date').textContent = new Date().toLocaleDateString('en-GB');

function addRow(d) {
  d = d || {};
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input class="name" placeholder="الخدمة"></td>
    <td><input class="hours" type="number" min="0"></td>
    <td><input class="rate" type="number" min="0"></td>
    <td class="line">0</td>
    <td class="noprint"><button class="del">🗑</button></td>`;
  tr.querySelector('.name').value = d.name || '';
  tr.querySelector('.hours').value = (d.hours !== undefined) ? d.hours : 1;
  tr.querySelector('.rate').value = (d.rate !== undefined) ? d.rate : 0;
  rows.appendChild(tr);
}

const enc = obj => {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};
const dec = str => {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  const bin = atob(str);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
};
function collect() {
  return {
    client: client.value, num: num.value, contact: contact.value,
    currency: currency.value, discount: discount.value, tax: tax.value,
    notes: notes.value,
    rows: [...rows.querySelectorAll('tr')].map(tr => ({
      name: tr.querySelector('.name').value,
      hours: tr.querySelector('.hours').value,
      rate: tr.querySelector('.rate').value
    }))
  };
}
function save() {
  if (document.body.classList.contains('view')) return;
  try {
    const data = {
      client: client.value,
      num: num.value,
      contact: contact.value,
      discount: discount.value,
      tax: tax.value,
      notes: notes.value,
      currency: currency.value,
      rows: [...rows.querySelectorAll('tr')].map(tr => ({
        name: tr.querySelector('.name').value,
        hours: tr.querySelector('.hours').value,
        rate: tr.querySelector('.rate').value
      }))
    };
    localStorage.setItem(KEY, JSON.stringify(data));
  } catch (e) {}
}

function update() {
  let total = 0;
  rows.querySelectorAll('tr').forEach(tr => {
    const h = parseFloat(tr.querySelector('.hours').value) || 0;
    const r = parseFloat(tr.querySelector('.rate').value) || 0;
    const line = h * r;
    tr.querySelector('.line').textContent = line;
    total += line;
  });
  const sub = total;
  const d = Math.min(Math.max(parseFloat(discount.value) || 0, 0), 100);
  const tx = Math.max(parseFloat(tax.value) || 0, 0);
  const dAmt = sub * d / 100;
  const tAmt = (sub - dAmt) * tx / 100;
  const cur = ' ' + currency.value;
  const f = n => Math.round(n * 100) / 100;
  document.getElementById('subtotal').textContent = f(sub) + cur;
  document.getElementById('discRow').style.display = d ? '' : 'none';
  document.getElementById('discPct').textContent = d;
  document.getElementById('discAmt').textContent = '-' + f(dAmt) + cur;
  document.getElementById('taxRow').style.display = tx ? '' : 'none';
  document.getElementById('taxPct').textContent = tx;
  document.getElementById('taxAmt').textContent = '+' + f(tAmt) + cur;
  totalEl.textContent = f(sub - dAmt + tAmt) + cur;
  save();
}

function load() {
  try {
    const m = location.hash.match(/^#q=(.+)$/);
    let d;
    if (m) { d = dec(m[1]); document.body.classList.add('view'); }
    else d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (d) {
      client.value = d.client || '';
      num.value = d.num || '';
      contact.value = d.contact || '';
      discount.value = d.discount || 0;
      tax.value = d.tax || 0;
      notes.value = d.notes || '';
      currency.value = d.currency || '$';
      (d.rows || []).forEach(r => addRow(r));
    }
  } catch (e) {}
  if (!rows.children.length) addRow();
  update();
}

rows.addEventListener('input', update);
client.addEventListener('input', update);
currency.addEventListener('input', update);
num.addEventListener('input', update);
contact.addEventListener('input', update);
discount.addEventListener('input', update);
tax.addEventListener('input', update);
notes.addEventListener('input', update);
rows.addEventListener('click', e => {
  if (e.target.classList.contains('del')) {
    e.target.closest('tr').remove();
    update();
  }
});
document.getElementById('add').addEventListener('click', () => { addRow(); update(); });
document.getElementById('print').addEventListener('click', () => window.print());
document.getElementById('share').addEventListener('click', async () => {
  const url = location.origin + location.pathname + '#q=' + enc(collect());
  try {
    await navigator.clipboard.writeText(url);
    alert('تم نسخ الرابط. ابعته للعميل.');
  } catch (e) {
    prompt('انسخ الرابط:', url);
  }
});
document.getElementById('reset').addEventListener('click', () => {
  if (confirm('مسح العرض الحالي والبدء من جديد؟')) {
    try { localStorage.removeItem(KEY); } catch (e) {}
    location.reload();
  }
});
load();
if (document.body.classList.contains('view')) document.querySelectorAll('input,textarea').forEach(el => el.readOnly = true);
</script>
</body>
</html>
